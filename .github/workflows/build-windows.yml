name: 🖥️ Build Windows Desktop

on:
  # 触发方式 1：打 tag 时自动触发 (例如 git tag v1.0.0 && git push --tags)
  push:
    tags:
      - 'v*.*.*'
  # 触发方式 2：在 GitHub Actions 面板手动点击 "Run workflow"
  workflow_dispatch: 

env:
  NODE_OPTIONS: --max-old-space-size=8192
  # 如果你的项目必须用到这些环境变量，请在 GitHub 仓库的 Settings -> Secrets 中自行配置
  # VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
  # VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  build-and-release:
    runs-on: windows-latest # 仅在 Windows 环境下运行

    permissions:
      contents: write # 必须的权限：允许向 GitHub Releases 写入/上传文件

    steps:
      - name: 📦 Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: 🛠️ Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm i

      - name: ⚙️ Prebuild packages (Windows)
        run: pnpm run build:packages

      - name: 🔄 Update main hash
        working-directory: apps/desktop
        run: pnpm update:main-hash

      - name: 🏗️ Build - Vite (Frontend)
        working-directory: apps/desktop
        run: pnpm build:electron-vite

      - name: 🏗️ Build - Electron Forge (Windows EXE)
        working-directory: apps/desktop
        run: pnpm build:electron-forge

      # --- 以下为 Release 环节 ---
      
      - name: 🚀 Create GitHub Release and Upload EXE
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }} # Release 的标题
          draft: false
          prerelease: false
          # 自动寻找生成的 exe 和 yml(用于自动更新) 文件并上传
          files: |
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.yml
