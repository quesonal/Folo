name: 🖥️ Build Windows Desktop

on:
  # 触发方式 1：打 tag 时自动触发 (例如 git tag v1.0.0 && git push --tags)
  push:
    tags:
      - 'v*.*.*'
  # 触发方式 2：手动运行并输入 Tag
  workflow_dispatch:
    inputs:
      tag_name:
        description: "请输入 Release Tag 版本 (例如: v1.0.0)"
        required: true
        type: string
        default: "v1.0.0-beta"

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build-and-release:
    runs-on: windows-latest 

    permissions:
      contents: write # 必须的权限：允许创建 Tag 和 Release

    steps:
      - name: 📦 Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: 🛠️ Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm i

      - name: ⚙️ Prebuild packages (Windows)
        run: pnpm run build:packages

      - name: 🔄 Update main hash
        working-directory: apps/desktop
        run: pnpm update:main-hash

      - name: 🏗️ Build - Vite (Frontend)
        working-directory: apps/desktop
        run: pnpm build:electron-vite

      - name: 🏗️ Build - Electron Forge (Windows EXE)
        working-directory: apps/desktop
        run: pnpm build:electron-forge

      # --- Release 环节 ---
      
      - name: 🚀 Create GitHub Release and Upload EXE
        uses: softprops/action-gh-release@v3
        with:
          # 动态获取 Tag：如果是手动运行则用输入的 tag_name；如果是 Push 触发则用 ref_name
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.yml
